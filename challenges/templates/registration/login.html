{% extends "base.html" %}

{% block title %}登入 - 粉絲挑戰打卡{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">登入</h1>
    <p class="auth-subtitle">歡迎回來，繼續你的挑戰旅程！</p>

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      
      {% if form.errors %}
      <div class="alert alert-error">
        帳號或密碼錯誤，請重新輸入。
      </div>
      {% endif %}

      <div class="form-group">
        <label for="id_username" class="form-label">使用者名稱</label>
        <input type="text" name="username" id="id_username" class="form-input" placeholder="請輸入使用者名稱" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="id_password" class="form-label">密碼</label>
        <input type="password" name="password" id="id_password" class="form-input" placeholder="請輸入密碼" required autocomplete="current-password">
      </div>

      <input type="hidden" name="next" value="{{ next|default:'/challenges/' }}">
      
      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: var(--space-lg);">登入</button>
    </form>

    <div class="auth-footer">
      還沒有帳號嗎？ <a href="{% url 'signup' %}">立即註冊</a>
    </div>
  </div>
</div>
{% endblock %}
